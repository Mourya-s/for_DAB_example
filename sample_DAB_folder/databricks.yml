# This is a Declarative Automation Bundle definition for sample_DAB_folder.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sample_DAB_folder
  uuid: 1a604db4-c7b1-44b7-8641-670bba8bd712

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-780b98e4-5294.cloud.databricks.com
    variables:
      catalog: dab_catalog_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-780b98e4-5294.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/somu72shekar@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/somu72shekar@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_catalog_dev
      schema: prod
    permissions:
      - user_name: somu72shekar@gmail.com
        level: CAN_MANAGE
